name: Docker Build and Publish

on:
  # Build but don't publish on PRs (validation only)
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'packages/**'
      - '.github/workflows/docker.yml'
  
  # Build and publish on push to main
  push:
    branches: [main]
  
  # Build and publish on releases
  release:
    types: [published]
  
  # Called by the release workflow after a new @nandu/service release
  workflow_call:
    inputs:
      version:
        description: 'Semantic version of the release (e.g. 1.2.3)'
        type: string
        required: true
      ref:
        description: 'Git ref (release tag) to build the image from'
        type: string
        required: true

  # Manual trigger
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Container Registry'
        type: boolean
        default: false
      version:
        description: 'Service version to publish (e.g. 1.2.3)'
        type: string
        required: false
      ref:
        description: 'Git ref for the service release tag'
        type: string
        required: false

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed for publishing to GHCR
    
    steps:
      - name: Validate manual release inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          if [[ -n "$RELEASE_VERSION" && -z "$RELEASE_REF" ]] || \
             [[ -z "$RELEASE_VERSION" && -n "$RELEASE_REF" ]]; then
            echo "Provide both version and ref to recover a service release."
            exit 1
          fi
          if [[ -n "$RELEASE_VERSION" && "$RELEASE_REF" != "refs/tags/@nandu/service@$RELEASE_VERSION" ]]; then
            echo "Ref must be refs/tags/@nandu/service@<version> matching the supplied version."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve source revision
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=${{ github.event_name != 'workflow_dispatch' || inputs.version == '' }}
          tags: |
            # For pushes to branches (e.g., 'main' when pushed to main)
            type=ref,event=branch,enable=${{ inputs.version == '' }}
            # Tag with the long Git SHA of the built commit (e.g., 'sha-abcdef12345...')
            type=raw,value=sha-${{ steps.rev.outputs.sha }}

            # Immutable semantic version tags for releases (e.g., 1.2.3, v1.2.3, 1.2, v1.2, 1, v1).
            # The version comes from the release workflow (workflow_call) or from a semver Git tag.
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern=v{{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ github.event_name != 'workflow_dispatch' || inputs.version == '' }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ inputs.version }},enable=${{ github.event_name != 'workflow_dispatch' || inputs.version == '' }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ github.event_name != 'workflow_dispatch' || inputs.version == '' }}
            type=semver,pattern=v{{major}},value=${{ inputs.version }},enable=${{ github.event_name != 'workflow_dispatch' || inputs.version == '' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
      
      # Determine if we should publish
      - name: Set publishing flag
        id: publish
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # Publish if:
          # 1. Push to main branch
          # 2. Release is published
          # 3. Manual workflow run with publish=true
          # 4. Called by the release workflow with a release version
          if [[ -n "$RELEASE_VERSION" && "${{ github.event_name }}" != "workflow_dispatch" ]] || \
             [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]] || \
             [[ "${{ github.event_name }}" == "release" ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.publish }}" == "true" ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi
      
      # Only login if we're going to publish
      - name: Log in to GitHub Container Registry
        if: steps.publish.outputs.should_publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ steps.publish.outputs.should_publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ inputs.version || github.ref_name }}
      
      # Summarize what we did
      - name: Workflow summary
        run: |
          echo "## Docker Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref:** ${{ inputs.ref || github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ steps.rev.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Images Built:**" >> $GITHUB_STEP_SUMMARY
          
          # List all the tags we built
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'); do
            echo "  - \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.publish.outputs.should_publish }}" == "true" ]]; then
            echo "✅ **Published to GitHub Container Registry**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Digest:** \`ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Build only (not published)**" >> $GITHUB_STEP_SUMMARY
          fi
